- name: Setup
  hosts: localhost
  become: true # run as sudo
  connection: local
  gather_facts: true

  vars:
    packages:
      Debian: ['ca-certificates', 'curl', 'fzf', 'gcc', 'git', 'gnupg', 'htop', 'ripgrep', 'tmux', 'unzip', 'vim', 'zsh']
      Suse:   ['ca-certificates', 'curl', 'gcc', 'git-core', 'gnupg', 'htop', 'ripgrep', 'tmux', 'unzip', 'vim', 'zsh']

  tasks:

    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.SUDO_USER or default(ansible_user_id) }}"

    - name: Update apt cache
      apt:
        update_cache: yes
      when: ansible_os_family == 'Debian'

    - name: Install packages
      package:
        name: "{{ packages[ansible_os_family] }}"
        state: present
      when: ansible_os_family in packages

    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: /usr/bin/zsh

    - name: Check if Oh My Zsh is already installed
      ansible.builtin.stat:
        path: "/home/{{ remote_regular_user }}/.oh-my-zsh"
      register: oh_my_zsh_dir
      become: false

    - name: Install Oh My Zsh (unattended)
      ansible.builtin.shell: |
        sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
      args:
        creates: "/home/{{ remote_regular_user }}/.oh-my-zsh"
        chdir: "/home/{{ remote_regular_user }}"
      when: not oh_my_zsh_dir.stat.exists
      become: false


    - name: Define zsh plugins
      ansible.builtin.set_fact:
        zsh_plugins:
          - name: zsh-autosuggestions
            repo: https://github.com/zsh-users/zsh-autosuggestions
          - name: zsh-syntax-highlighting
            repo: https://github.com/zsh-users/zsh-syntax-highlighting

    - name: Clone Zsh plugins
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "/home/{{ remote_regular_user }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
        update: yes
      loop: "{{ zsh_plugins }}"
      become: false

    - name: Clone Powerlevel10k theme
      ansible.builtin.git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "/home/{{ remote_regular_user }}/.oh-my-zsh/custom/themes/powerlevel10k"
        update: yes
      become: false

    - name: Ensure .zshrc ownership and permissions
      ansible.builtin.file:
        path: "/home/{{ remote_regular_user }}/.zshrc"
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user }}"
        mode: "0644"

    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: /usr/bin/zsh
      
    - name: Add Docker GPG key (Debian/Ubuntu)
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Docker APT repository (Debian/Ubuntu)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      when: ansible_os_family == "Debian"

    - name: Install Docker Engine (Debian/Ubuntu)
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Docker Engine (openSUSE)
      zypper:
        name:
          - docker
          - docker-compose
          - docker-buildx
        state: present
      when: ansible_os_family == "Suse"

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        groups: docker
        append: true

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ensure fonts directory
      ansible.builtin.file:
        path: "~{{ remote_regular_user }}/.fonts"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"

    - name: Check if Jetbrains Mono exists
      ansible.builtin.shell: "ls ~{{ remote_regular_user }}/.fonts/JetBrainsMonoNerd*FontMono*"
      register: jetbrains_mono_exists
      ignore_errors: true
      changed_when: false

    - name: Download Jetbrains mono
      when: jetbrains_mono_exists is failed
      ansible.builtin.unarchive:
        src: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz
        dest: "~{{ remote_regular_user }}/.fonts/"
        remote_src: true
        mode: "0755"
        owner: "{{ remote_regular_user }}"

    - name: Check if proto is installed
      ansible.builtin.command: which proto
      register: check_proto_exists
      changed_when: false
      failed_when: false


    - name: Install proto
      ansible.builtin.shell: "curl -fsSL https://moonrepo.dev/install/proto.sh | bash -s -- --yes"
      args:
        executable: /bin/bash
      when: check_proto_exists.rc != 0

    - name: Install Node.js using proto CLI
      ansible.builtin.shell: "proto install node -- --lts"
      environment:
        PATH: "{{ ansible_env.HOME }}/.proto/bin:{{ ansible_env.PATH }}"

    - name: Install pnpm using proto CLI
      ansible.builtin.shell: "proto install pnpm -- --lts"
      environment:
        PATH: "{{ ansible_env.HOME }}/.proto/bin:{{ ansible_env.PATH }}"

    - name: Add Microsoft repository for VS Code
      zypper_repository:
        name: microsoft-vscode
        description: Microsoft Visual Studio Code
        repo: https://packages.microsoft.com/yumrepos/vscode
        autorefresh: yes
        enabled: yes
        disable_gpg_check: no
        auto_import_keys: yes

    - name: Refresh zypper repositories
      ansible.builtin.shell: "zypper refresh"

    - name: Install Visual Studio Code
      zypper:
        name: code
        state: present

    - name: Install neovim
      zypper:
          name: neovim
          state: present
